services:
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--save", "60", "1"]

  api:
    build: .
    image: claude-intercom-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      VALKEY_URL: redis://valkey:6379
    depends_on:
      - valkey

volumes:
  valkey-data:
