services:
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--save", "60", "1"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intercom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intercom}
      POSTGRES_DB: intercom
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/pg/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: .
    image: claude-intercom-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      VALKEY_URL: redis://valkey:6379
      DATABASE_URL: postgres://intercom:${POSTGRES_PASSWORD:-intercom}@postgres:5432/intercom
    depends_on:
      - valkey
      - postgres

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_INTERCOM_API_URL: ${PUBLIC_INTERCOM_API_URL:-http://localhost:8787}
    image: claude-intercom-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://intercom:${POSTGRES_PASSWORD:-intercom}@postgres:5432/intercom
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret-change-me}
      INTERCOM_API_URL: http://api:8787
      VALKEY_URL: redis://valkey:6379
    depends_on:
      - postgres
      - api
      - valkey

volumes:
  valkey-data:
  postgres-data:
